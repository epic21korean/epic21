<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPIC21 — 무료 한국어 교재 / Free Korean Textbooks</title>
<meta name="description" content="Free Korean textbooks in 20 languages. TOPIK I & II. No sign-up, no payment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   EPIC21 · 교재 배포 허브
   색: 표지의 남색 / 원고지 크림 / 띠지 주황 / 채점 붉은선
   구조: 원고지 칸에 언어를 한 자씩 앉힌다
   ───────────────────────────────────────────── */
:root{
  --ink:#0E1730;
  --ink-2:#182648;
  --cream:#F5F0E3;
  --amber:#E8913C;
  --rule:#C4695A;
  --muted:#8E9AB4;
  --cell:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:"Noto Sans KR","Noto Sans","Noto Sans Arabic","Noto Sans Bengali",
    "Noto Sans Devanagari","Noto Sans Khmer","Noto Sans Myanmar","Noto Sans Sinhala",
    "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;min-height:100vh;
  background-image:radial-gradient(120% 70% at 50% -10%, #1B2A4E 0%, transparent 60%);
}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 72px}

header{padding:52px 0 36px;text-align:center}
.mark{font-size:13px;letter-spacing:.42em;font-weight:700;color:var(--amber);margin-bottom:20px}
h1{font-size:clamp(26px,6.4vw,44px);font-weight:900;line-height:1.25;letter-spacing:.34em;text-indent:.34em}
.sub{margin-top:14px;color:var(--muted);font-size:15px}
.count{display:inline-block;margin-top:20px;padding:7px 16px;border:1px solid rgba(232,145,60,.5);
  border-radius:999px;color:var(--amber);font-size:13px;font-weight:700}

/* 이 영상의 교재 안내 띠 */
.forvideo{
  max-width:920px;margin:0 auto 26px;padding:14px 18px;
  background:rgba(232,145,60,.1);border:1px solid rgba(232,145,60,.35);
  border-radius:6px;text-align:center;
}
.forvideo[hidden]{display:none}
.forvideo b{display:block;font-size:16px;font-weight:700}
.forvideo span{font-size:13px;color:var(--muted)}

.sheet{background:var(--cream);border-radius:4px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);position:relative}
.sheet::before{content:"";position:absolute;inset:10px;
  border:1px solid rgba(196,105,90,.35);border-radius:2px;pointer-events:none}
.sheet-label{color:#7C6A57;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  margin-bottom:14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  border-top:1px solid rgba(196,105,90,.45);border-left:1px solid rgba(196,105,90,.45)}
.cellbtn{appearance:none;background:transparent;cursor:pointer;border:0;
  border-right:1px solid rgba(196,105,90,.45);border-bottom:1px solid rgba(196,105,90,.45);
  min-height:var(--cell);padding:12px 10px;font:inherit;font-size:16px;font-weight:500;
  color:#1D2740;text-align:center;transition:background .14s ease,color .14s ease}
.cellbtn:hover{background:rgba(232,145,60,.2)}
.cellbtn:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.cellbtn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

#panel{margin-top:36px}
#panel[hidden]{display:none}
.panelhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 16px;margin-bottom:20px}
.chosen{font-size:24px;font-weight:700}
.change{appearance:none;background:transparent;border:1px solid rgba(245,240,227,.28);
  color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;
  cursor:pointer;transition:border-color .14s,color .14s}
.change:hover{border-color:var(--amber);color:var(--amber)}
.change:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 강조 교재 */
.feat{background:var(--cream);color:#141C31;border-radius:8px;padding:24px;
  margin-bottom:30px;box-shadow:0 18px 44px rgba(0,0,0,.4)}
.feat .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:#A8543F;font-weight:700;margin-bottom:10px}
.feat .bko{font-size:21px;font-weight:700;line-height:1.4}
.feat .ben{font-size:13px;color:#6B5B4A;margin-top:4px}
.feat .get{margin-top:18px;font-size:16px;padding:14px 26px}
.otherlabel{font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:6px}

.book{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:20px 0;
  border-top:1px solid rgba(245,240,227,.13)}
.book:last-child{border-bottom:1px solid rgba(245,240,227,.13)}
.bmeta{flex:1 1 260px;min-width:0}
.bko{font-size:17px;font-weight:700;line-height:1.4}
.ben{font-size:13px;color:var(--muted);margin-top:3px}
.get{display:inline-flex;align-items:center;gap:9px;background:var(--amber);color:#231607;
  border:0;border-radius:6px;padding:12px 22px;font:inherit;font-size:15px;font-weight:700;
  text-decoration:none;transition:transform .12s ease,filter .12s ease;white-space:nowrap}
.get:hover{filter:brightness(1.08);transform:translateY(-1px)}
.get:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.get svg{width:16px;height:16px;flex:none}
.na{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.feat .na{color:#8A7360}
.state{padding:28px 0;color:var(--muted);font-size:15px}
.state a{color:var(--amber)}

footer{margin-top:56px;padding-top:26px;border-top:1px solid rgba(245,240,227,.12);
  display:flex;flex-wrap:wrap;gap:10px 26px;font-size:14px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
footer a:hover{color:var(--amber);border-bottom-color:var(--amber)}
footer a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

@media (max-width:520px){
  :root{--cell:52px}
  header{padding:38px 0 26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .cellbtn{font-size:15px}
  .get{width:100%;justify-content:center}
  .feat{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark">EPIC21</div>
  <h1>무료 한국어 교재</h1>
  <p class="sub">Free Korean textbooks · TOPIK I &amp; II</p>
  <div class="count" id="freeBadge">가입 없음 · 결제 없음</div>
</header>

<div class="forvideo" id="forvideo" hidden></div>

<main>
  <section class="sheet" aria-labelledby="pickLabel">
    <div class="sheet-label" id="pickLabel">언어를 고르세요 / Choose your language</div>
    <div class="grid" id="grid" role="group" aria-labelledby="pickLabel"></div>
  </section>

  <section id="panel" hidden aria-live="polite">
    <div class="panelhead">
      <span class="chosen" id="chosen"></span>
      <button class="change" id="change" type="button">Change language</button>
    </div>
    <div id="books"><p class="state">…</p></div>
  </section>
</main>

<footer>
  <a href="https://archive.org/details/@epic21korean">Internet Archive</a>
  <a href="https://www.youtube.com/@EPIC21korean">YouTube · @EPIC21korean</a>
  <span>CC BY-NC-ND 4.0</span>
</footer>

</div>

<script>
/* ═══════════════════════════════════════════════════

     slug = 주소 뒤 #이름 (영상별로 이 교재를 앞에 띄울 때)
   파일명은 아카이브에서 자동으로 읽어 옵니다.

   영상별 링크 예시
     https://epic21korean.github.io/epic21/#two-hands
     https://epic21korean.github.io/epic21/#clinic
   ═══════════════════════════════════════════════════ */
var BOOKS = [
  { id:'epic21-essential-korean-grammar', slug:'grammar',

  { id:'epic21-topik2-mv-vol1-four-seasons', slug:'four-seasons',

  { id:'epic21-topik1-mv-vol6-transit-card', slug:'transitcard',

    en:"TOPIK I, Vol.6 'Please Top Up My Transit Card'" },
  { id:'epic21-topik1-mv-vol7-shopping', slug:'shopping',
    ko:'뮤직비디오로 배우는 TOPIK I · 제7편 이거 입어 봐도 돼요?',
    en:"TOPIK I, Vol.7 'Can I Try This On?'" },
  { id:'epic21-topik1-mv-vol8-samgyeopsal', slug:'samgyeopsal',
    ko:'뮤직비디오로 배우는 TOPIK I · 제8편 우리 삼겹살 먹을까?',
    en:"TOPIK I, Vol.8 'Shall We Get Samgyeopsal?'" },
  { id:'epic21-topik1-mv-vol9-chicken', slug:'chicken',
    ko:'뮤직비디오로 배우는 TOPIK I · 제9편 오는 데 얼마나 걸려요?',
    en:"TOPIK I, Vol.9 'How Long Will It Take?'" },
  { id:'epic21-topik1-mv-vol10-clinic', slug:'clinic',
    ko:'뮤직비디오로 배우는 TOPIK I · 제10편 나 감기 걸렸나 봐',
    en:"TOPIK I, Vol.10 'I Think I Caught a Cold'" }
];

/* [파일명 속 영어 이름, 언어 코드, 그 언어 표기, RTL] */
var LANGS = [
  ['English','en','English'],
  ['Spanish','es','Español'],
  ['French','fr','Français'],
  ['Portuguese','pt','Português'],
  ['Indonesian','id','Bahasa Indonesia'],
  ['Vietnamese','vi','Tiếng Việt'],
  ['Tagalog','tl','Tagalog'],
  ['Uzbek','uz','Oʻzbekcha'],
  ['Russian','ru','Русский'],
  ['Mongolian','mn','Монгол'],
  ['Japanese','ja','日本語'],
  ['Chinese-Simplified','zh-Hans','简体中文'],
  ['Thai','th','ภาษาไทย'],
  ['Khmer','km','ភាសាខ្មែរ'],
  ['Burmese','my','မြန်မာ'],
  ['Nepali','ne','नेपाली'],
  ['Bengali','bn','বাংলা'],
  ['Sinhala','si','සිංහල'],
  ['Arabic','ar','العربية', true],
  ['Urdu','ur','اردو', true]
];

/* 0 받기 · 1 언어 바꾸기 · 2 아직 없음 · 3 아카이브에서 열기
   4 가입/결제 없음 · 5 다른 교재 · 6 이 영상의 교재 */
var UI = {
  en:['Download','Change language','Not available yet','Open on Archive','No sign-up · No payment','Other textbooks','For this video'],
  es:['Descargar','Cambiar idioma','Aún no disponible','Abrir en Archive','Sin registro · Sin pago','Otros libros','Para este video'],
  fr:['Télécharger','Changer de langue','Pas encore disponible','Ouvrir sur Archive','Sans inscription · Sans paiement','Autres manuels','Pour cette vidéo'],
  pt:['Baixar','Mudar de idioma','Ainda não disponível','Abrir no Archive','Sem cadastro · Sem pagamento','Outros livros','Para este vídeo'],
  id:['Unduh','Ganti bahasa','Belum tersedia','Buka di Archive','Tanpa pendaftaran · Tanpa biaya','Buku lainnya','Untuk video ini'],
  vi:['Tải về','Đổi ngôn ngữ','Chưa có','Mở trên Archive','Không đăng ký · Không trả phí','Các giáo trình khác','Cho video này'],
  tl:['I-download','Palitan ang wika','Wala pa','Buksan sa Archive','Walang rehistro · Walang bayad','Iba pang aklat','Para sa video na ito'],
  uz:['Yuklab olish','Tilni oʻzgartirish','Hozircha yoʻq','Archive’da ochish','Roʻyxatsiz · Toʻlovsiz','Boshqa darsliklar','Ushbu video uchun'],
  ru:['Скачать','Сменить язык','Пока нет','Открыть на Archive','Без регистрации · Бесплатно','Другие учебники','Для этого видео'],
  mn:['Татах','Хэл солих','Одоохондоо байхгүй','Archive дээр нээх','Бүртгэлгүй · Үнэгүй','Бусад сурах бичиг','Энэ видеоны сурах бичиг'],
  ja:['ダウンロード','言語を変える','準備中','Archiveで開く','登録不要・無料','ほかの教材','この動画の教材'],
  'zh-Hans':['下载','更换语言','暂无','在 Archive 打开','无需注册 · 完全免费','其他教材','本视频的教材'],
  th:['ดาวน์โหลด','เปลี่ยนภาษา','ยังไม่มี','เปิดใน Archive','ไม่ต้องสมัคร · ฟรี','หนังสือเล่มอื่น','สำหรับวิดีโอนี้'],
  km:['ទាញយក','ប្តូរភាសា','មិនទាន់មាន','បើកនៅ Archive','មិនចាំបាច់ចុះឈ្មោះ · ឥតគិតថ្លៃ','សៀវភៅផ្សេងទៀត','សម្រាប់វីដេអូនេះ'],
  my:['ဒေါင်းလုဒ်','ဘာသာစကား ပြောင်းရန်','မရှိသေးပါ','Archive တွင် ဖွင့်ရန်','အကောင့်မလို · အခမဲ့','အခြားဖတ်စာအုပ်များ','ဤဗီဒီယိုအတွက်'],
  ne:['डाउनलोड','भाषा बदल्नुहोस्','अहिले उपलब्ध छैन','Archive मा खोल्नुहोस्','दर्ता छैन · निःशुल्क','अन्य पाठ्यपुस्तक','यो भिडियोको लागि'],
  bn:['ডাউনলোড','ভাষা বদলান','এখনও নেই','Archive-এ খুলুন','নিবন্ধন নেই · বিনামূল্যে','অন্যান্য পাঠ্যবই','এই ভিডিওর জন্য'],
  si:['බාගන්න','භාෂාව වෙනස් කරන්න','තවම නැත','Archive හි විවෘත කරන්න','ලියාපදිංචියක් නැත · නොමිලේ','වෙනත් ග්‍රන්ථ','මෙම වීඩියෝව සඳහා'],
  ar:['تحميل','تغيير اللغة','غير متوفر بعد','افتح في Archive','بدون تسجيل · مجانًا','كتب أخرى','لهذا الفيديو'],
  ur:['ڈاؤن لوڈ','زبان بدلیں','ابھی دستیاب نہیں','Archive پر کھولیں','رجسٹریشن نہیں · مفت','دیگر کتابیں','اس ویڈیو کے لیے']

var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13m0 0 5-5m-5 5-5-5M4 21h16"/></svg>';

var gridEl   = document.getElementById('grid');
var panelEl  = document.getElementById('panel');
var booksEl  = document.getElementById('books');
var chosenEl = document.getElementById('chosen');
var changeEl = document.getElementById('change');
var badgeEl  = document.getElementById('freeBadge');
var forEl    = document.getElementById('forvideo');

var cache = {};
var current = null;

/* 주소 뒤 #이름 으로 강조할 교재 정하기 */
function featured() {
  var s = (location.hash || '').replace('#', '').toLowerCase();
  if (!s) return null;
  for (var i = 0; i < BOOKS.length; i++) {
    if (BOOKS[i].slug === s) return BOOKS[i];
  }
  return null;
}

function showBanner() {
  var f = featured();
  if (!f) { forEl.hidden = true; return; }
  forEl.hidden = false;
  forEl.innerHTML = '<b lang="ko">' + f.ko + '</b><span lang="en">' + f.en + '</span>';
}
showBanner();
window.addEventListener('hashchange', function () {
  showBanner();
  if (current) pick(current[0], current[1]);
});

LANGS.forEach(function (L) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'cellbtn';
  b.lang = L[1];
  b.textContent = L[2];
  b.setAttribute('aria-pressed', 'false');
  if (L[3]) b.dir = 'rtl';
  b.addEventListener('click', function () { pick(L, b); });
  gridEl.appendChild(b);
});

changeEl.addEventListener('click', function () {
  gridEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  gridEl.querySelector('.cellbtn').focus();
});

function pick(L, btn) {
  current = [L, btn];
  var cells = gridEl.querySelectorAll('.cellbtn');
  for (var i = 0; i < cells.length; i++) {
    cells[i].setAttribute('aria-pressed', cells[i] === btn ? 'true' : 'false');
  }

  var t = UI[L[1]] || UI.en;
  chosenEl.lang = L[1];
  chosenEl.textContent = L[2];
  changeEl.lang = L[1];
  changeEl.textContent = t[1];
  badgeEl.lang = L[1];
  badgeEl.textContent = t[4];
  panelEl.dir = L[3] ? 'rtl' : 'ltr';
  panelEl.hidden = false;
  booksEl.innerHTML = '<p class="state">…</p>';

  Promise.all(BOOKS.map(function (bk) { return files(bk.id); }))
    .then(function (lists) { render(L, t, lists); })
    .catch(function () {
      booksEl.innerHTML = '<p class="state">Connection failed. ' +
        '<a href="https://archive.org/details/@epic21korean">Open on Archive</a></p>';
    });
}

function files(id) {
  if (cache[id]) return Promise.resolve(cache[id]);
  return fetch('https://archive.org/metadata/' + id)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var names = (j.files || []).filter(function (f) {
        return /\.pdf$/i.test(f.name) && (!f.source || f.source === 'original');
      }).map(function (f) { return f.name; });
      cache[id] = names;
      return names;
    })
    .catch(function () { cache[id] = []; return []; });
}

/* 파일명에서 언어를 찾는다.
   두 가지 형태를 모두 인정한다.
     …_English_…  (밑줄로 이어지는 경우)
     …_English.pdf (언어 이름으로 끝나는 경우 — 제2편 이후)  */
function action(bk, list, L, t, big) {
  var token = '_' + L[0].toLowerCase();
  var hit = null;
  for (var i = 0; i < list.length; i++) {
    var n = list[i].toLowerCase();
    if (n.indexOf(token + '_') > -1 || n.indexOf(token + '.') > -1) {
      hit = list[i];
      break;
    }
  }
  if (hit) {
    return '<a class="get" lang="' + L[1] + '" href="https://archive.org/download/' +
      bk.id + '/' + encodeURIComponent(hit) + '">' + ARROW + '<span>' + t[0] + '</span></a>';
  }
  return '<a class="na" lang="' + L[1] + '" href="https://archive.org/details/' +
    bk.id + '">' + t[2] + ' — ' + t[3] + '</a>';
}

function render(L, t, lists) {
  var f = featured();
  var html = '';

  if (f) {
    var fi = BOOKS.indexOf(f);
    html += '<div class="feat">' +
      '<div class="tag" lang="' + L[1] + '">' + t[6] + '</div>' +
      '<div class="bko" lang="ko">' + f.ko + '</div>' +
      '<div class="ben" lang="en">' + f.en + '</div>' +
      action(f, lists[fi] || [], L, t, true) +
      '</div>' +
      '<div class="otherlabel" lang="' + L[1] + '">' + t[5] + '</div>';
  }

  BOOKS.forEach(function (bk, i) {
    if (f && bk === f) return;
    html += '<div class="book"><div class="bmeta">' +
      '<div class="bko" lang="ko">' + bk.ko + '</div>' +
      '<div class="ben" lang="en">' + bk.en + '</div></div>' +
      action(bk, lists[i] || [], L, t, false) + '</div>';
  });

  booksEl.innerHTML = html;
}
