   return `<button class="opt${sel}" data-i="${i+1}"><span class="c">${C[i]}</span><span>${q.options_audio?'':esc(o)}</span></button>`}).join('')+`</div></div>`;
 app.innerHTML=h; scrollTo(0,0);
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[q.n]=+b.dataset.i;render()});
 if($('play')) $('play').onclick=()=>play(q);
 const last=S.phase==='read'?20:40, first=S.phase==='read'?1:21;
 $('prev').disabled=S.cur===first; $('next').textContent=S.cur===last?(S.phase==='read'?'듣기로 ▶':'제출하기'):'다음 ▶'}
/* 듣기: 유튜브 「듣기」 영상의 구간 재생. 영상이 아직 없으면 브라우저 음성으로 미리 듣기 */
let YTP=null,ytReady=false,stopT=null;
function loadYT(){ if(!T.listen_video||window.YT) return; const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
 window.onYouTubeIframeAPIReady=()=>{YTP=new YT.Player('ytp',{videoId:T.listen_video,playerVars:{playsinline:1},events:{onReady:()=>ytReady=true}})}}
function play(q){
 const k=String(T.listen&&T.listen[q.n]?q.n:(q.script_ref||q.n));
 if(T.listen_video&&T.listen&&T.listen[k]&&ytReady){const [a,b]=T.listen[k];YTP.seekTo(a,true);YTP.playVideo();clearTimeout(stopT);stopT=setTimeout(()=>YTP.pauseVideo(),(b-a)*1000);return}
 const sc=(q.script||byN[q.script_ref].script); speechSynthesis.cancel();
 sc.forEach(([who,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;u.pitch=who==='남'?.8:1.15;speechSynthesis.speak(u)})}
function next(){const last=S.phase==='read'?20:40;
 if(S.cur<last){S.cur++;render();return}
 if(S.phase==='read'){if(confirm('읽기를 끝내고 듣기를 시작할까요? 읽기로 돌아올 수 없습니다.'))startPhase('listen')}
 else{const left=IT.filter(q=>q.n>20&&!S.ans[q.n]).length; if(confirm(left?`안 푼 문제가 ${left}개 있습니다. 제출할까요?`:'제출할까요?'))submit()}}
function sheet(){
 let h=`<div class="lbl">${S.phase==='read'?'읽기':'듣기'} 문제 번호 (색칠 = 답함)</div><div class="nums">`;
 IT.forEach(q=>{const on=inPhase(q.n);h+=`<button class="${S.ans[q.n]?'done':''} ${q.n===S.cur?'cur':''} ${on?'':'lock'}" data-n="${q.n}" ${on?'':'disabled'}>${q.n}</button>`});
 $('sheetIn').innerHTML=h+'</div>'; $('sheet').classList.add('on');
 $('sheetIn').querySelectorAll('button[data-n]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.n;$('sheet').classList.remove('on');render()})}
function submit(){
 clearInterval(S.timer);speechSynthesis.cancel();if(YTP&&ytReady)YTP.pauseVideo();S.phase='done';$('nav').style.display='none';$('time').textContent='';$('sec').textContent='결과';
 let r=0,l=0; IT.forEach(q=>{if(S.ans[q.n]===q.answer){q.n<=20?r++:l++}});
 const pt=(r+l)*2.5, ex=T.explain_video, link=n=>ex?`https://www.youtube.com/watch?v=${ex}&t=${(T.explain||{})[n]||0}s`:'';
 let h=`<div class="card"><div class="score"><div class="lbl">내 점수</div><div class="pt">${pt}<small> / 100</small></div></div>
 <div class="bar"><div>읽기<b>${r*2.5}</b>${r}/20</div><div>듣기<b>${l*2.5}</b>${l}/20</div></div>`;
 for(const [k,v] of Object.entries(D.cutoffs)) h+=`<div class="cut ${pt>=v?'pass':'fail'}"><span>${k} 하한 ${v}점</span><span>${pt>=v?'넘었어요':'아직이에요'}</span></div>`;
 h+=`<p class="note">하한 점수를 넘으면 구직자 명부 순위 경쟁에 들어갑니다. 실제 선발은 높은 점수 순서입니다.</p>`;
 h+=`<div class="lbl" style="margin-top:14px">문제별 결과</div><div class="nums">`+IT.map(q=>`<button class="${S.ans[q.n]===q.answer?'ok':'ng'}" disabled>${q.n}</button>`).join('')+`</div>`;
 const W=IT.filter(q=>S.ans[q.n]!==q.answer);
 if(W.length){h+=`<div class="lbl" style="margin-top:14px">틀린 문제 ${W.length}개 — 해설 영상에서 풀이를 보세요</div>`+
   W.map(q=>`<div class="wrong"><span class="qno">${q.n}</span><span>${q.section}</span><a class="${ex?'':'wait'}" href="${link(q.n)}" target="_blank" rel="noopener">${ex?'▶ 해설 영상':'영상 준비 중'}</a></div>`).join('')}
 h+=`<a class="sub-cta" href="https://www.youtube.com/@EPIC21korean?sub_confirmation=1" target="_blank" rel="noopener">▶ 다음 회 모의고사 알림 받기 (유튜브 구독)</a>
 <button class="big navy" onclick="location.reload()">다시 풀기</button></div>`;
 app.innerHTML=h; scrollTo(0,0)}
$('prev').onclick=()=>{S.cur--;render()}; $('next').onclick=next; $('gridb').onclick=sheet; $('closeS').onclick=()=>$('sheet').classList.remove('on');
loadYT(); startScreen();
</script></body></html>
